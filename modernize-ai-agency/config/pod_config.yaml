# LegacyModern AI — delivery pod resourcing and model token allocation.
#
# Read by: agents/05_delivery_pod_manager.md (budget + burndown), agents/03 and 04 (per-work-order
# budgets), and humans planning capacity. All money is USD. Token rates are USD per 1M tokens.
#
# Business model: ten enterprise accounts x $100,000/month retainer = $1,000,000 MRR.
# Delivery model: AI agents perform all work; the CEO is the only human (accountable reviewer
# and signatory). A "pod" is reserved capacity of the supervised AI pipeline for one account.
# Each pod's model spend is capped at $6,500/month.

version: 1

agency:
  name: LegacyModern AI
  mrr_target_usd: 1000000
  target_accounts: 10
  retainer_fee_usd_per_month: 100000
  pilot_fee_usd: 50000
  pilot_length_days: 14
  pilot_max_loc: 50000
  target_gross_margin_pct: 65

sprint:
  length_days: 14
  start_weekday: Monday
  ceremonies:
    - { name: sprint_planning, day: 1, duration_minutes: 90, owner: ceo }
    - { name: daily_async_standup, day: daily, duration_minutes: 0, owner: 05_delivery_pod_manager }
    - { name: client_status_call, day: 5, duration_minutes: 30, owner: ceo }
    - { name: mid_sprint_budget_review, day: 7, duration_minutes: 20, owner: 05_delivery_pod_manager }
    - { name: client_status_call, day: 10, duration_minutes: 30, owner: ceo }
    - { name: milestone_signoff_review, day: 13, duration_minutes: 60, owner: ceo }
    - { name: retrospective, day: 14, duration_minutes: 45, owner: ceo }
  burndown:
    unit: story_points
    points_per_work_order:
      standard: 5    # <= 5,000 legacy LOC, <= 8 business rules
      complex: 13    # <= 15,000 legacy LOC or shared global state / external dependencies
      epic: 21       # must be split before it enters a sprint
    at_risk_threshold_pct_behind_ideal: 15
    off_track_threshold_pct_behind_ideal: 30

work_orders:
  # Provider Business Days (Mon-Fri, IST), matching the retainer MSA Exhibit B.
  sla_business_days:
    standard: 5       # verified contract published -> PR approved by the parity gatekeeper
    complex: 10
  max_concurrent_per_pod: 2
  acceptance:
    parity_pass_rate: 1.0
    min_branch_coverage: 0.90
    max_p99_latency_ms: 250
    required_checks: [format, lint, vet, build, unit, characterization, race, vuln, lineage]

token_budget:
  monthly_ceiling_usd_per_pod: 6500
  currency: USD
  # Share of the monthly ceiling reserved for each agent role. Must sum to 100.
  allocation_pct:
    01_gemini_cognitive_ingest: 8
    02_mcp_spec_publisher: 7
    03_claude_code_transpiler: 55
    04_automated_parity_gatekeeper: 15
    05_delivery_pod_manager: 3
    reserve: 12
  # Planned spend per work order; the pod manager flags any work order at 1.5x plan.
  per_work_order_plan_usd:
    01_gemini_cognitive_ingest: 40
    02_mcp_spec_publisher: 35
    03_claude_code_transpiler: 300
    04_automated_parity_gatekeeper: 80
  planned_work_orders_per_month: 6
  alert_thresholds_pct: [50, 75, 90, 100]
  actions:
    "50": notify_ceo
    "75": require_effort_review    # transpiler drops from high to medium effort on non-critical work orders
    "90": freeze_new_work_orders   # only in-flight work orders continue; reserve is unlocked by the CEO
    "100": hard_stop               # API keys for the pod are rotated to a zero-quota key until next cycle
  reconciliation:
    source_of_truth: provider_invoices   # Anthropic Console usage + Google Cloud billing export
    cadence: weekly
    max_tracking_drift_pct: 5

models:
  rates_verified_on: "2026-10-12"
  catalog:
    claude-opus-5-5:
      provider: anthropic
      input: 4.00
      output: 20.00
      cache_read: 0.20
      cache_write_5m: 5.00
      context_window_tokens: 1000000
      notes: "Default Claude Code model. Thinking cannot be disabled; control cost with effort (default medium)."
    claude-sonnet-5-5:
      provider: anthropic
      input: 2.00
      output: 10.00
      cache_read: 0.20
      cache_write_5m: 2.50
      context_window_tokens: 1000000
    claude-haiku-5-5:
      provider: anthropic
      input: 0.10
      output: 0.50
      input_over_100k: 0.50
      output_over_100k: 2.50
      context_window_tokens: 1000000
    gemini-3.1-pro-preview:
      provider: google
      # Rates not yet verified: Google's pricing page was unreachable from the build
      # environment. Enter them from https://ai.google.dev/gemini-api/docs/pricing before the
      # first billing cycle; until then the pod manager reports Gemini spend as "unpriced"
      # (token counts only) instead of estimating.
      input_up_to_200k: null
      input_over_200k: null
      output_up_to_200k: null
      output_over_200k: null
      context_window_tokens: 1048576
      notes: "Production ingest model. Requires a billing-enabled key: the free tier has zero Pro quota."
    gemini-3-flash-preview:
      provider: google
      input_up_to_200k: null
      output_up_to_200k: null
      context_window_tokens: 1048576
      notes: "Evaluation/demo ingest on free-tier keys. Verified live on 2026-10-13: LNFEE010 in 76 s, 15,884 tokens, 9/9 assertions correct against the compiled COBOL."
  assignment:
    01_gemini_cognitive_ingest: { model: gemini-3.1-pro-preview, temperature: 0, free_tier_fallback: gemini-3-flash-preview }
    02_mcp_spec_publisher: { model: claude-sonnet-5-5, effort: high }
    03_claude_code_transpiler: { model: claude-opus-5-5, effort: high }
    04_automated_parity_gatekeeper: { model: claude-sonnet-5-5, effort: high }
    05_delivery_pod_manager: { model: claude-haiku-5-5, effort: medium }
    06_daily_client_outreach: { model: claude-sonnet-5-5, effort: medium, budget_scope: agency_overhead }

pod_template:
  humans:
    - role: ceo
      count: 1
      responsibilities:
        - client relationship, discovery calls and status calls
        - approving and sending every first-touch email
        - reviewing every business rule, review flag and gate report before a deliverable is submitted
        - accepting deliverables and signing for the company (never delegated to agents)
        - finance, tax and compliance filings with the company's CA/CS
  agents:
    - 01_gemini_cognitive_ingest
    - 02_mcp_spec_publisher
    - 03_claude_code_transpiler
    - 04_automated_parity_gatekeeper
    - 05_delivery_pod_manager
  # Reserved capacity is bounded by the CEO's review time, not by agent throughput.
  capacity:
    concurrent_work_orders: 2
    standard_work_orders_per_month: 6
  monthly_cost_plan_usd:
    model_tokens: 6500
    infrastructure: 1500     # CI runners, replay storage, observability
    insurance_and_tooling: 1000   # tech E&O + cyber premium (broker quote pending), accounting, e-sign
    professional_services: 500    # CA/CS retainer, statutory audit accrual, counsel on contracts
    total: 9500
  monthly_revenue_usd: 100000
  notes: "Founder compensation is decided by the CEO and the CA (salary vs dividend) and is not part of this plan."

pods:
  - { id: pod-alpha, status: staffed, client_account: null, start_date: null }
  - { id: pod-bravo, status: staffed, client_account: null, start_date: null }
  - { id: pod-charlie, status: bench, client_account: null, start_date: null }
  - { id: pod-delta, status: bench, client_account: null, start_date: null }
  - { id: pod-echo, status: bench, client_account: null, start_date: null }
  - { id: pod-foxtrot, status: bench, client_account: null, start_date: null }
  - { id: pod-golf, status: bench, client_account: null, start_date: null }
  - { id: pod-hotel, status: bench, client_account: null, start_date: null }
  - { id: pod-india, status: bench, client_account: null, start_date: null }
  - { id: pod-juliet, status: bench, client_account: null, start_date: null }

capacity_triggers:
  # The CEO's review time is the bottleneck. Before taking more work than the capacity above,
  # either decline/queue it or bring in a second accountable reviewer -- and update the contracts'
  # Delivery Model section first, since clients are told the CEO is the only human.
  add_reviewer_when:
    concurrent_work_orders_requested: 3
    or_retainers_signed: 2
  lead_time_days: 30

escalation:
  sla_breach_risk: [ceo, client_technical_owner]
  budget_threshold_90: [ceo]
  parity_failure_after_two_cycles: [ceo, legacy_sme, client_technical_owner]
  security_or_data_incident: [ceo, client_ciso, cert_in]   # CERT-In within 6 hours where the directions apply
